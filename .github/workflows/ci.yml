name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.14"
  UV_NO_PROGRESS: "1"
  # Bounded retries for the package downloads every job makes (uv from PyPI,
  # npm for the Kordoc runtime). The e2e scripts retry their own Docker Hub
  # pulls and release-asset probes; see docs/OPERATIONS.md for what to do when
  # a transient failure survives them.
  UV_HTTP_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRIES: "5"

jobs:
  quality:
    name: quality / python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_DB: kip
          POSTGRES_USER: kip_owner
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kip_owner -d kip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      KIP_CONFIG: config/kip.example.toml
      KIP_DATABASE_URL: postgresql://kip_owner:test-password@127.0.0.1:5432/kip
      KIP_TEST_POSTGRES_URL: postgresql://kip_owner:test-password@127.0.0.1:5432/kip
      KIP_WORKSPACE: default
      KIP_ENV: test
      KIP_CAS_PATH: ${{ github.workspace }}/var/ci-cas
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a test checks that every PostgreSQL image pin KIP
          # ever shipped is known to the .env pin refresh.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked test environment
        run: >-
          uv sync --frozen
          --extra postgres
          --extra api
          --extra identity
          --extra extractors
          --extra mcp
          --extra dev

      - name: Cold prerequisite bootstrap without host Python or Node on PATH
        if: matrix.python-version == '3.12'
        run: ./scripts/smoke-prerequisites.sh

      - name: Check generated contracts, boundaries, lint, and types
        run: |
          mkdir -p var/ci-cas
          uv run python -m compileall -q src tests scripts sdk
          while IFS= read -r script; do bash -n "$script"; done < <(find scripts examples -type f -name '*.sh' -print | sort)
          uv run python scripts/generate_contracts.py --check
          uv run python scripts/verify_project.py
          uv run ruff check src tests scripts
          uv run mypy src/kip

      - name: Audit locked runtime dependencies
        if: matrix.python-version == '3.12'
        run: >-
          uv run pip-audit
          --requirement requirements/runtime.txt
          --no-deps
          --disable-pip

      - name: Audit locked Kordoc runtime dependencies
        if: matrix.python-version == '3.12'
        run: ./scripts/audit-kordoc.sh

      - name: Migrate and run tests with coverage
        run: |
          uv run kip migrate
          uv run pytest --cov --cov-report=term --cov-report=xml
          ./scripts/golden-gate.sh --portable

      - name: Upload coverage evidence
        if: success() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  distribution:
    name: distribution candidate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read release version
        id: version
        shell: bash
        run: |
          {
            echo "value=$(tr -d '[:space:]' < VERSION)"
            echo "epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Install locked build environment
        run: uv sync --frozen --extra dev

      - name: Build wheel
        run: uv build --build-constraints requirements/build.txt --wheel --out-dir dist/wheels

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          uv venv "$smoke_dir" --python 3.12
          uv pip install --python "$smoke_dir/bin/python" dist/wheels/*.whl
          KIP_CONFIG="$PWD/config/kip.example.toml" \
          KIP_DATABASE_URL="memory://" \
          KIP_CAS_PATH="$smoke_dir/cas" \
            "$smoke_dir/bin/kip" capabilities > "$smoke_dir/capabilities.json"
          "$smoke_dir/bin/python" -c 'import json,sys; payload=json.load(open(sys.argv[1])); assert payload["ok"] and payload["schema_version"] == "kip.envelope.v1"' "$smoke_dir/capabilities.json"

      # Attestations make buildx emit a manifest list, which the docker
      # exporter cannot export, so `load: true` and provenance/sbom are
      # mutually exclusive. This image only has to be loadable for the
      # hardened smoke test below and supply a digest for the bundle; the
      # published image is built and attested by the publish job, which
      # pushes to a registry and can carry a manifest list.
      - name: Build loadable candidate image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: kip-ci:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run hardened image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --read-only \
            --tmpfs /tmp:size=64m,noexec,nosuid,nodev \
            --tmpfs /data:size=64m,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 10001:10001 \
            -e KIP_CONFIG=/app/config/kip.container.toml \
            -e KIP_DATABASE_URL=memory:// \
            -e KIP_CAS_PATH=/data/cas \
            -e KIP_ENV=test \
            "kip-ci:${GITHUB_SHA}" capabilities > image-capabilities.json
          python -c 'import json; payload=json.load(open("image-capabilities.json")); assert payload["ok"] and payload["schema_version"] == "kip.envelope.v1"'

      - name: Build and verify release bundle
        env:
          KIP_API_IMAGE: local/kip@${{ steps.image.outputs.digest }}
          KIP_WORKER_IMAGE: local/kip@${{ steps.image.outputs.digest }}
          KIP_MIGRATE_IMAGE: local/kip@${{ steps.image.outputs.digest }}
          KIP_RELEASE_WHEEL: dist/wheels/kip_knowledge_fabric-${{ steps.version.outputs.value }}-py3-none-any.whl
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        run: |
          ./scripts/release-bundle.sh dist/release
          ./scripts/verify-release.sh dist/release
          ./scripts/verify-release.sh dist/release.tar.gz

      - name: Upload verified distribution candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kip-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: |
            dist/wheels/*.whl
            dist/release.tar.gz
            dist/release/artifacts/*.json
            image-capabilities.json
          if-no-files-found: error
          retention-days: 14


  # Everything below exercises the SHIPPED ARTIFACT and the deployment it
  # becomes, which is where 3.12.0 through 3.14.1 actually broke: the gate was
  # green for every one of those releases. Each job states its measured
  # runtime; the fast ones run on every push, the slow ones on the tag that
  # publishes and on manual dispatch, and `publish` below depends on all of
  # them so a red end-to-end check cannot publish.
  #
  # NOT gated: the offline model-runtime check (.github/workflows/semantic-runtime.yml,
  # the 3.12.1 defect). It downloads 1.2 GB of weights, so `publish` does not
  # require it and a tag publishes whether that workflow is green, red or was
  # never run. Dispatching it before tagging is a manual release step.
  #
  # These jobs download from GitHub releases, Docker Hub, npm and PyPI. The
  # downloads retry, but a failure that outlasts the retries still fails the job
  # and skips `publish`. The remedy is "Re-run failed jobs" on that tag's run,
  # which re-runs `publish` after them; do not move or recreate the tag.
  #
  # The scripts are the entry point, not the YAML: `./scripts/e2e-install.sh`,
  # `./scripts/e2e-upgrade.sh`, `./scripts/e2e-db-roles.sh` and
  # `./scripts/e2e-semantic.sh` run the identical check on a developer machine.
  # Each starts and removes its own throwaway PostgreSQL container, so no job
  # here needs a service container and the local and CI runs are the same run.

  # Runtime: 6-8 minutes expected on ubuntu-latest, where the locked
  # environment, the Kordoc runtime and the Korean OCR models download cold.
  # Measured at 1m17s on a developer machine with warm caches.
  # On every push: a defect that only appears once the published package is
  # installed is exactly the class this repository kept shipping, and it is
  # visible thirty seconds after installing.
  installer-e2e:
    name: installer end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Builds the package archive, serves it from a local release mirror,
      # installs it with scripts/install.sh into a clean directory under a
      # throwaway HOME (so the runner's own shell profile is never touched),
      # bootstraps it, migrates, syncs the bundled sample-data, and asserts on
      # the search / read / xlsx-read envelopes and on the CLI exit codes.
      - name: Install the shipped package and exercise it
        run: ./scripts/e2e-install.sh

  # Runtime: 2-3 minutes, nearly all of it the locked-environment install; the
  # check itself measured 5s and downloads no model (a stub runtime stands in
  # for Infinity). On every push: 3.12.2 lost a release to a runtime that
  # served another model and answered HTTP 200 anyway.
  semantic-served-model:
    name: semantic served-model guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The check drives this checkout's CLI against a stub runtime, so the
      # locked environment has to exist before it runs.
      - name: Install the locked environment
        run: >-
          uv sync --frozen
          --extra postgres
          --extra api
          --extra identity
          --extra extractors
          --extra mcp
          --extra dev

      - name: A runtime serving another model cannot embed queries
        run: ./scripts/e2e-semantic.sh --mode served-model

  # Runtime: 4-6 minutes, nearly all of it the locked-environment install; the
  # check itself measured 10s. On every push: the roles, the row level security they
  # exist to make effective, and the backup that 3.13.0 found could be silently
  # empty are all cheap to prove against a throwaway PostgreSQL.
  # The second step renders compose.production.yaml and constructs the identity
  # its api, worker and migrate services would build at start-up (3.13.0
  # shipped that file with an identity mode the code rejects). It boots nothing.
  # NOT covered by this job: that the api and worker CONTAINERS are the ones
  # using those roles, and that any API container boots. The compose-roles job
  # below boots compose.yaml; nothing in CI boots compose.production.yaml.
  database-roles:
    name: database roles and row level security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the locked environment
        run: >-
          uv sync --frozen
          --extra postgres
          --extra api
          --extra identity
          --extra extractors
          --extra mcp
          --extra dev

      - name: Roles, cross-workspace isolation, backup and restore
        run: ./scripts/e2e-db-roles.sh --mode database

      - name: compose.production.yaml constructs the identity the code implements
        run: ./scripts/e2e-db-roles.sh --mode production-config

  # Runtime: 10-14 minutes, dominated by the runtime image build (measured
  # 9-10 minutes cold, 19s against a warm image cache). Tag and manual
  # dispatch only: it is the slowest check and its value is at release time.
  # It boots compose.yaml plus deploy/compose.roles.yaml - the application
  # profile ./scripts/app-up.sh starts, with api_key identity from .env - and
  # proves what the database-roles job cannot: that this API answers /readyz
  # and that the api and worker backends really are kip_api and kip_worker
  # rather than the bootstrap superuser. It does NOT start
  # compose.production.yaml (proxy_jwt, secrets, pinned images); that file's
  # identity configuration is checked, without booting, by the database-roles
  # job's production-config step.
  compose-roles:
    name: compose stack roles
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Bring up the Compose application profile and check its roles
        run: ./scripts/e2e-db-roles.sh --mode compose

  # Runtime: 10-14 minutes expected (two installs, two bootstraps of a locked
  # environment, two upgrades, all downloading cold); measured 1m19s on a
  # developer machine with warm caches. Tag and manual dispatch only.
  #
  # This job NEEDS NETWORK ACCESS to this repository's published release
  # assets: it installs the previous published release from
  # https://github.com/<owner>/<repo>/releases/download and upgrades it to the
  # candidate. It does not skip when that is unreachable - it fails, and says
  # which tags it tried. An upgrade check that silently skips is worse than no
  # upgrade check, and the silent-skip is how 3.12.1's launcher defect reached
  # a live deployment.
  upgrade-e2e:
    name: upgrade end-to-end
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # fetch-depth 0: the job picks the previous published release from this
      # repository's own tags, newest first, skipping tags whose release was
      # never published.
      - name: Check out source with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Upgrade the previous published release to this candidate
        run: ./scripts/e2e-upgrade.sh

  publish:
    name: publish immutable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - quality
      - distribution
      - installer-e2e
      - semantic-served-model
      - database-roles
      - compose-roles
      - upgrade-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Everything this step checks must hold BEFORE anything is published: an
      # immutable image and its attestations cannot be withdrawn, so a tag
      # whose CHANGELOG section is missing has to fail here, not after.
      - name: Validate tag and image name
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # AGENTS.md and CONTRIBUTING.md require a CHANGELOG entry for every
          # behaviour, contract, configuration or deployment change, so a tag
          # with no section is an incomplete release. Fail; do not fall back to
          # a bare release body.
          if ! ./scripts/changelog-section.sh "$version" > "$RUNNER_TEMP/changelog-section.md"; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## $version' section. Every release needs one; add it, retag, and publish again." >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "epoch=$(git show -s --format=%ct HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build signed release payload
        shell: bash
        env:
          KIP_RELEASE_WHEEL: dist/wheels/kip_knowledge_fabric-${{ steps.release.outputs.version }}-py3-none-any.whl
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.epoch }}
        run: |
          set -euo pipefail
          uv sync --frozen --extra dev
          uv build --build-constraints requirements/build.txt --wheel --out-dir dist/wheels
          image_ref="${{ steps.release.outputs.image }}@${{ steps.image.outputs.digest }}"
          KIP_API_IMAGE="$image_ref" \
          KIP_WORKER_IMAGE="$image_ref" \
          KIP_MIGRATE_IMAGE="$image_ref" \
            ./scripts/release-bundle.sh dist/release
          ./scripts/verify-release.sh dist/release.tar.gz

      - name: Build and verify package archive
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-package.sh
          ./scripts/verify-package.sh "dist/kip-${{ steps.release.outputs.version }}.zip"
          # Installers shipped with 3.9.x request kip-starter-kit-<version>.zip;
          # build the legacy-format copy (manifest under its former name and
          # schema id, same payload) here so it is attested and archived with
          # the other release subjects before publishing.
          version="${{ steps.release.outputs.version }}"
          python3 scripts/legacy_archive.py "dist/kip-$version.zip" "dist/kip-starter-kit-$version.zip"
          (cd dist && sha256sum "kip-starter-kit-$version.zip" > "kip-starter-kit-$version.zip.sha256")

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/wheels/*.whl
            dist/release.tar.gz
            dist/kip-${{ steps.release.outputs.version }}.zip
            dist/kip-starter-kit-${{ steps.release.outputs.version }}.zip

      - name: Attest release wheel SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/wheels/*.whl
          sbom-path: dist/release/artifacts/sbom.spdx.json

      - name: Upload immutable release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kip-release-${{ steps.release.outputs.version }}
          path: |
            dist/wheels/*.whl
            dist/release.tar.gz
            dist/release/artifacts/*.json
            dist/kip-${{ steps.release.outputs.version }}.zip
            dist/kip-${{ steps.release.outputs.version }}.zip.sha256
            dist/kip-starter-kit-${{ steps.release.outputs.version }}.zip
            dist/kip-starter-kit-${{ steps.release.outputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 90

      # A workflow artifact expires and needs a signed-in user who can find the
      # run. The package is the primary way an adopter installs KIP, so it
      # is attached to a durable public release instead.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          notes="$(mktemp)"
          trap 'rm -f "$notes"' EXIT
          # The section this tag's CHANGELOG entry holds, extracted and
          # validated by the "Validate tag and image name" step above, so every
          # release says what changed in it instead of repeating fixed text.
          # A release body caps at 125,000 characters; scripts/changelog-section.sh
          # refuses a section large enough to approach that, before publishing.
          {
            printf '## What changed in %s\n\n' "$version"
            cat "$RUNNER_TEMP/changelog-section.md"
            printf '\n---\n\n'
          } > "$notes"
          cat >> "$notes" <<NOTES
          Container image: \`ghcr.io/${{ github.repository }}:$version\`

          ### Install (one command)
          \`\`\`bash
          curl -fsSL https://github.com/${{ github.repository }}/releases/download/v$version/install.sh | bash -s -- ~/kip --version $version
          \`\`\`
          The installer downloads \`kip-$version.zip\`, verifies it
          against \`kip-$version.zip.sha256\` before extracting, then
          runs \`./scripts/bootstrap.sh\`. Review \`install.sh\` first if your
          policy requires it; the manual path (download, verify, unzip, follow
          \`docs/DEPLOYMENT_GUIDE.md\` section 2) is unchanged.

          ### Upgrading an existing deployment
          Run the same command with the existing directory, or
          \`./scripts/upgrade.sh --version $version\` inside it. Only package-owned
          files listed in the manifests are replaced; \`.env\`, \`config/kip*.toml\`,
          \`.mcp.json\`, \`var/\` and ontology additions are preserved, previous package
          files are kept under \`var/upgrades/\` for \`--rollback\`. See
          \`docs/DEPLOYMENT_GUIDE.md\` section 11.

          ### Licensing
          KIP is MIT. It ships AGPL-3.0 PyMuPDF and LGPL-3.0 psycopg; see
          \`THIRD-PARTY-NOTICES.md\` before redistributing or offering KIP as a
          network service.

          Full history: https://github.com/${{ github.repository }}/blob/v$version/CHANGELOG.md
          NOTES
          assets=(
            "dist/kip-$version.zip"
            "dist/kip-$version.zip.sha256"
            "dist/kip-starter-kit-$version.zip"
            "dist/kip-starter-kit-$version.zip.sha256"
            "dist/release.tar.gz"
            "scripts/install.sh"
          )
          for extra in dist/wheels/*.whl dist/release/artifacts/*.json; do
            assets+=("$extra")
          done
          # Re-running a tag has to converge on one published release. A prior
          # attempt can leave a release behind, and deleting the tag it points
          # at demotes that release to a draft, so create would fail and the
          # draft would stay invisible.
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release edit "v$version" \
              --title "KIP Knowledge Fabric $version" \
              --notes-file "$notes" \
              --draft=false
            gh release upload "v$version" "${assets[@]}" --clobber
          else
            gh release create "v$version" \
              --title "KIP Knowledge Fabric $version" \
              --notes-file "$notes" \
              "${assets[@]}"
          fi
