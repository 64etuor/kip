[app]
environment = "development"
workspace = "default"
log_level = "INFO"

[database]
url_env = "KIP_DATABASE_URL"
statement_timeout_ms = 15000
# Background vector projection builds scan and insert far more rows.
projection_statement_timeout_ms = 300000
pool_max_size = 10

[storage]
cas_path = "./var/cas"

[api]
host = "127.0.0.1"
port = 8080
max_request_bytes = 10485760

[identity]
mode = "api_key"

[identity.api_key]
principal_id = "bootstrap-operator"
acl_scopes = ["workspace:default"]

[identity.jwt]
issuer = "https://identity.example.com/"
audience = "kip-api"
jwks_url = "https://identity.example.com/.well-known/jwks.json"
algorithms = ["RS256"]
principal_claim = "sub"
workspace_claim = "workspace"
group_claim = "groups"
scope_claim = "acl_scopes"
group_scope_prefix = "group:"
admin_groups = ["kip-admins"]
snapshot_id_claim = "acl_snapshot_id"
snapshot_version_claim = "acl_snapshot_version"
snapshot_captured_at_claim = "acl_snapshot_captured_at"
snapshot_expires_at_claim = "acl_snapshot_expires_at"
jwks_cache_seconds = 300
jwks_timeout_seconds = 5
clock_skew_seconds = 30

[security]
allow_remote_model_egress = false
# Bare host names of model services on the deployment's private network that
# count as local while remote model egress stays off (containers: "models").
model_service_hosts = []
follow_symlinks = false
max_file_bytes = 524288000

[telemetry]
query_traces_enabled = true
retention_days = 30

[search]
# Hybrid lexical+vector retrieval is the default (ADR-065). Search falls back
# to the lexical path, with a `semantic_degraded` warning, while the model
# runtime is down or the projection is still being built. For the BGE
# cross-encoder set `default_mode = "reranked"`, `[models.reranker] backend =
# "http"` and start the runtime with KIP_SEMANTIC_RERANKER=on.
semantic_enabled = true
default_mode = "hybrid"
# Activate a complete projection automatically when its embedding identity is
# one the KIP release measured; any other identity waits for
# `kip projection activate` after evaluation.
semantic_auto_activate = true
# Overall answer context size is set per request via --max-chars (default 120000), not a config key.
context_item_max_chars = 16000
alias_expansion_enabled = true
alias_expansion_max_terms = 16
max_hits_per_document = 3
abstain_on_unknown_terms = true
# abstention fires only when every query term is absent from the corpus
korean_ngram_min = 2
korean_ngram_max = 4
hybrid_candidate_limit = 40
rerank_candidate_limit = 40
lexical_rerank_enabled = true
lexical_rerank_candidate_limit = 40
rrf_rank_constant = 60
hnsw_ef_search = 200
hnsw_max_scan_tuples = 100000
# Query n-grams found in at least this share of lexical units (often from a
# shared folder path) are left out of candidate matching; 0 disables.
lexical_common_term_fraction = 0.02

[models]
# After a model runtime failure, skip it for this many seconds so every query
# does not wait for a timeout.
circuit_cooldown_seconds = 30

[models.embedding]
enabled = true
base_url = "http://127.0.0.1:7997"
model = "kip-qwen3-embedding-0.6b"
revision = "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
dimensions = 1024
batch_size = 32
# Upper bound on characters per embedding request so a rebuild never holds
# the shared runtime long enough to time out interactive query embeddings.
max_batch_chars = 16000
# Head/tail projection: units longer than this keep their first and last
# halves. 4000 characters covers almost every unit (Office paragraphs, sheets,
# HWP chunks and PDF pages average 800-2500) and bounds attention memory; at
# 12000 the runtime reached a 15 GB footprint on a 24 GB Mac (ADR-065). Any
# change creates a new embedding space identity (ADR-035).
max_document_chars = 4000
timeout_seconds = 120
query_timeout_seconds = 10
query_instruction = "Retrieve relevant Korean evidence for this query: "
space_name = "qwen3-embedding-0.6b-1024"
# Units per projection page: how many pending units one rebuild round claims.
page_size = 1000

[models.reranker]
enabled = true
backend = "bm25"
max_document_chars = 8000  # BM25 cap; set 2048 when backend = "http" (the HTTP reranker's default cap)
baseline_weight = 0.15
# bm25_k1 = 1.2
# bm25_b = 0.75
base_url = "http://127.0.0.1:7997"
model = "kip-bge-reranker-v2-m3"
revision = "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e"
# model = "jinaai/jina-reranker-v2-base-multilingual"
# revision = "9cfeff2df7d40d1b78e75e5e9cebec92a99813c9"
# max_length = 1024
# device = "mps"
timeout_seconds = 120
# The lexical path keeps BM25 via [models.lexical_reranker] (defaults shown) when backend = "http".
# [models.lexical_reranker]
# backend = "bm25"
# max_document_chars = 8000
# bm25_k1 = 1.2
# bm25_b = 0.75

[models.generation]
enabled = false
provider = "local"
base_url = "http://127.0.0.1:7998"
model = "replace-with-served-model-name"
revision = "replace-with-immutable-model-revision"
allowed_classifications = []
retention_policy = "provider_default"
secret_ref = "env:KIP_GENERATION_API_KEY"
timeout_seconds = 60
max_response_bytes = 1048576
max_claims = 16
max_output_tokens = 4096
fallback_on_error = false

[models.relation_mining]
enabled = false
max_units = 200
max_characters = 480000
max_entity_proposals = 128
max_relation_proposals = 256

[ontology]
domain_profile = "empty"
adaptive_discovery = true

[ontology.auto_approve]
# Calibrated review tiers (ADR pending, roadmap item 4): audited, measured,
# revocable auto-approval for low-risk, review-not-required predicates only.
# Opt-in: promotes candidates to facts without a human reviewer in the loop.
# Leave enabled=false (the default when this section is absent) until you
# have reviewed this workspace's predicate precision history; only then
# switch to enabled=true.
enabled = false
min_precision = 0.95
min_confidence = 0.8
min_reviewed = 20

[ontology.answer_context]
entity_limit = 16
edge_limit = 150
max_depth = 4

[ontology.migrations]
max_assertions = 10000

[interaction]
enabled = true
clarification_ttl_seconds = 3600

[sync]
# Filesystem deletion grace policy: an indexed file is soft-tombstoned only
# after this many CONSECUTIVE COMPLETE scans of its source confirm absence.
# Failed or partial scans never count, and a reappearing file clears the mark.
deletion_grace_scans = 2

[parsers]
parser_timeout_seconds = 120
minimum_quality_score = 0.70

[parsers.isolation]
enabled = true
wall_seconds = 180
cpu_seconds = 120
memory_mib = 6144
result_mib = 256
diagnostic_kib = 16
cpu_threads = 4
nice = 5

[parsers.pdf]
backend = "pdf_inspector"
# pdf_inspector emits page Markdown and Markdown tables; table pages without a
# valid Markdown table use selective PyMuPDF lines_strict fallback (ADR-054).
# tables_enabled applies when backend = "pymupdf" is selected for rollback.
tables_enabled = true

[parsers.ocr]
timeout_seconds = 120

[parsers.ocr.kordoc]
enabled = true
argv = ["kordoc", "--format", "json", "--ocr", "--silent"]
version_argv = ["kordoc", "--version"]
expected_version = "4.13.1"

[parsers.ocr.pptx]
max_images = 128
max_image_bytes = 20971520
max_total_bytes = 104857600
min_width_px = 96
min_height_px = 48

[parsers.hwp]
order = ["hwp-hwpx-parser", "kordoc", "unhwp"]

[parsers.hwp.hwp-hwpx-parser]
enabled = true
max_chars_per_unit = 4000

[parsers.hwp.kordoc]
enabled = false
argv = ["kordoc", "{input}", "--format", "json"]

[parsers.hwp.unhwp]
enabled = false
argv = ["unhwp", "convert", "{input}", "-o", "{output_dir}", "--all"]

[[sources.filesystem]]
name = "sample"
root = "./sample-data"
enabled = true
read_only = true
settle_seconds = 2
include_extensions = [".md", ".txt", ".pdf", ".pptx", ".xlsx", ".xlsm", ".hwp", ".hwpx", ".docx", ".csv"]
exclude_globs = ["**/.DS_Store", "**/~$*", "**/.~lock.*"]
acl_scope = "workspace:default"
classification = "internal"

[[sources.filesystem]]
name = "public-government"
root = "./var/public-corpus"
enabled = false
read_only = true
settle_seconds = 2
include_extensions = [".pdf"]
exclude_globs = ["**/.DS_Store", "**/~$*", "**/.~lock.*"]
acl_scope = "workspace:default"
classification = "public"

[sources.slack]
enabled = false
workspace_id = ""
allowed_conversation_ids = []
acl_snapshot_ttl_seconds = 900
token_env = "KIP_SLACK_BOT_TOKEN"
classification = "restricted"

[sources.apple_mail]
enabled = false
allowed_accounts = []
allowed_mailboxes = ["INBOX", "Sent", "Archive"]
lookback_days = 30
acl_snapshot_ttl_seconds = 900
classification = "restricted"

[sources.imap]
enabled = false
host = ""
port = 993
username_env = "KIP_IMAP_USERNAME"
password_env = "KIP_IMAP_PASSWORD"
mailboxes = ["INBOX", "Sent", "Archive"]
use_ssl = true
acl_snapshot_ttl_seconds = 900
classification = "restricted"
