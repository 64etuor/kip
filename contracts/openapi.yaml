components:
  schemas:
    AclSnapshot:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        version:
          type: string
          minLength: 1
          title: Version
        provider:
          type: string
          minLength: 1
          title: Provider
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        captured_at:
          type: string
          format: date-time
          title: Captured At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        configuration_owned:
          type: boolean
          title: Configuration Owned
          default: false
      additionalProperties: false
      type: object
      required:
      - id
      - version
      - provider
      - captured_at
      title: AclSnapshot
    AnswerRequest:
      properties:
        query:
          type: string
          minLength: 1
          title: Query
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 10
        mode:
          anyOf:
          - type: string
            enum:
            - lexical
            - vector
            - hybrid
            - reranked
          - type: 'null'
          title: Mode
        source_kinds:
          items:
            type: string
          type: array
          title: Source Kinds
        document_types:
          items:
            type: string
          type: array
          title: Document Types
        project_ids:
          items:
            type: string
          type: array
          title: Project Ids
        include_candidate_assertions:
          type: boolean
          title: Include Candidate Assertions
          default: false
        max_chars:
          type: integer
          maximum: 200000.0
          minimum: 1000.0
          title: Max Chars
          default: 32000
      additionalProperties: false
      type: object
      required:
      - query
      title: AnswerRequest
    CandidateProposal:
      properties:
        subject_id:
          type: string
          title: Subject Id
        predicate:
          type: string
          title: Predicate
        object_entity_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Object Entity Id
        object_value:
          title: Object Value
        evidence_unit_id:
          items:
            type: string
          type: array
          title: Evidence Unit Id
        origin:
          type: string
          title: Origin
          default: human
        ontology_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Ontology Version
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
      additionalProperties: false
      type: object
      required:
      - subject_id
      - predicate
      title: CandidateProposal
      description: POST /v1/review/candidates body, mirroring the CLI `review propose`
        fields.
    ClarificationAnswer:
      properties:
        question_id:
          type: string
          maxLength: 128
          minLength: 1
          title: Question Id
        option_ids:
          items:
            type: string
          type: array
          maxItems: 8
          title: Option Ids
        freeform:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Freeform
        remember:
          type: boolean
          title: Remember
          default: false
      additionalProperties: false
      type: object
      required:
      - question_id
      title: ClarificationAnswer
    ClarificationChoice:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 1
          title: Id
        label:
          type: string
          maxLength: 140
          minLength: 1
          title: Label
      additionalProperties: false
      type: object
      required:
      - id
      - label
      title: ClarificationChoice
    ClarificationRequest:
      properties:
        reason:
          type: string
          enum:
          - ambiguous_term
          - scope_selection
          - preference
          - other
          title: Reason
        prompt:
          type: string
          maxLength: 500
          minLength: 1
          title: Prompt
        choices:
          items:
            $ref: '#/components/schemas/ClarificationChoice'
          type: array
          maxItems: 8
          title: Choices
        allow_freeform:
          type: boolean
          title: Allow Freeform
          default: true
        allow_multiple:
          type: boolean
          title: Allow Multiple
          default: false
        preference_key:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Preference Key
      additionalProperties: false
      type: object
      required:
      - reason
      - prompt
      title: ClarificationRequest
    ConnectorEvent:
      properties:
        schema_version:
          type: string
          const: kip.connector-event.v1
          title: Schema Version
          default: kip.connector-event.v1
        event_id:
          type: string
          title: Event Id
        connector_name:
          type: string
          title: Connector Name
        operation:
          type: string
          enum:
          - upsert
          - delete
          - sync_complete
          title: Operation
        external_id:
          type: string
          title: External Id
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        payload:
          additionalProperties: true
          type: object
          title: Payload
        acl_scopes:
          items:
            type: string
          type: array
          title: Acl Scopes
        acl_snapshot:
          anyOf:
          - $ref: '#/components/schemas/AclSnapshot'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - event_id
      - connector_name
      - operation
      - external_id
      title: ConnectorEvent
    ContextRequest:
      properties:
        query:
          type: string
          minLength: 1
          title: Query
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 10
        mode:
          anyOf:
          - type: string
            enum:
            - lexical
            - vector
            - hybrid
            - reranked
          - type: 'null'
          title: Mode
        source_kinds:
          items:
            type: string
          type: array
          title: Source Kinds
        document_types:
          items:
            type: string
          type: array
          title: Document Types
        project_ids:
          items:
            type: string
          type: array
          title: Project Ids
        include_candidate_assertions:
          type: boolean
          title: Include Candidate Assertions
          default: false
        max_chars:
          type: integer
          maximum: 200000.0
          minimum: 1000.0
