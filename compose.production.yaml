name: kip-production

x-app-security: &app-security
  user: "10001:10001"
  read_only: true
  init: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie@sha256:b7337db8fe39d12fe8ecb0003c72680f24479813a744b43154eee6f2eab5a5f3
    restart: unless-stopped
    read_only: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kip}
      POSTGRES_USER: ${POSTGRES_USER:-kip_owner}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - type: volume
        source: kip_pgdata
        target: /var/lib/postgresql
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
      - /var/run/postgresql:size=16m,mode=3775,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [database]
    security_opt: ["no-new-privileges:true"]
    shm_size: 1gb
    command:
      - postgres
      - -c
      - shared_buffers=${KIP_POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${KIP_POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${KIP_POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${KIP_POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
          pids: 256

  # Embedding and reranker runtime for default semantic search (ADR-065).
  # It serves offline on the internal `models` network; populate kip_models
  # once with `docker compose -f compose.production.yaml --profile models-fetch
  # run --rm models-fetch`, the only service with model-download egress.
  models:
    image: ${KIP_MODELS_IMAGE:-michaelf34/infinity:0.0.77-cpu@sha256:94db836145f609c508f3f296f3b9bd0e78ae088025e879664d073dfd9f929e96}
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    # Embedding model only: the default hybrid mode does not call a
    # cross-encoder. For `models.reranker.backend = "http"`, append the
    # BAAI/bge-reranker-v2-m3 revision 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    # as a second --model-id/--revision/--served-model-name/--batch-size/--dtype.
    command: ["v2", "--host", "0.0.0.0", "--port", "7997",
              "--engine", "torch", "--device", "cpu", "--no-bettertransformer",
              "--model-id", "Qwen/Qwen3-Embedding-0.6B",
              "--revision", "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3",
              "--served-model-name", "kip-qwen3-embedding-0.6b",
              "--batch-size", "4", "--dtype", "float32"]
    volumes:
      - type: volume
        source: kip_models
        target: /models
    tmpfs:
      - /tmp:size=1g,mode=1777,nosuid,nodev
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/models', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    networks: [models]
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 6g
          pids: 256

  models-fetch:
    image: ${KIP_MODELS_IMAGE:-michaelf34/infinity:0.0.77-cpu@sha256:94db836145f609c508f3f296f3b9bd0e78ae088025e879664d073dfd9f929e96}
    profiles: ["models-fetch"]
    restart: "no"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      HF_HOME: /models
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    entrypoint: ["python", "-c", "from huggingface_hub import snapshot_download as fetch; fetch('Qwen/Qwen3-Embedding-0.6B', revision='97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3'); fetch('BAAI/bge-reranker-v2-m3', revision='953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e')"]
    volumes:
      - type: volume
        source: kip_models
        target: /models
    tmpfs:
      - /tmp:size=1g,mode=1777,nosuid,nodev
    networks: [model-egress]

  migrate:
    <<: *app-security
    image: ${KIP_MIGRATE_IMAGE:?set a digest-pinned migration image}
    restart: "no"
    profiles: ["migration"]
    environment:
      KIP_DATABASE_URL_FILE: /run/secrets/migrate_database_url
      KIP_CONFIG: /app/config/kip.container.toml
      KIP_ENV: production
    secrets:
      - migrate_database_url
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 256

  api:
    <<: *app-security
    image: ${KIP_API_IMAGE:?set a digest-pinned API image}
    restart: unless-stopped
    environment:
      KIP_DATABASE_URL_FILE: /run/secrets/api_database_url
      KIP_CONFIG: /app/config/kip.container.toml
      KIP_ENV: production
      KIP_API_HOST: 0.0.0.0
      KIP_CAS_PATH: /data/cas
      KIP_IDENTITY_MODE: jwt
      KIP_JWT_ISSUER: ${KIP_JWT_ISSUER:?set the trusted JWT issuer}
      KIP_JWT_AUDIENCE: ${KIP_JWT_AUDIENCE:?set the trusted JWT audience}
      KIP_JWT_JWKS_URL: ${KIP_JWT_JWKS_URL:?set the trusted JWKS URL}
    secrets:
      - api_database_url
    command: ["api", "serve", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KIP_API_PORT:-8080}:8080"
    healthcheck:
      # /readyz performs a real database round-trip, so an API that cannot
      # reach PostgreSQL reports unhealthy. /healthz remains liveness-only.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - type: volume
        source: kip_cas
        target: /data/cas
        read_only: true
      # The API must see the same source tree as the worker: evidence
      # freshness checks and xlsx range reads open the live source path.
      # Without this bind every unit looks stale and evidence is dropped.
      - type: bind
        source: ${KIP_NAS_PATH:?set the approved collection root}
        target: /sources/nas
        read_only: true
        bind:
          create_host_path: false
      # Ontology auto-release (ADR-044): admin approval of a discovery
      # candidate writes an additive release into the meaning contract.
      # Mount the version-controlled host checkout read-write on the API
      # (the admin review surface) so releases persist across restarts and
      # stay reviewable through git history. The host directory must be
      # writable by uid 10001.
      - type: bind
        source: ${KIP_ONTOLOGY_PATH:?set the version-controlled ontology checkout}
        target: /app/ontology
        bind:
          create_host_path: false
    networks: [edge, database, models]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
          pids: 256

  worker:
    <<: *app-security
    image: ${KIP_WORKER_IMAGE:?set a digest-pinned worker image}
    restart: unless-stopped
    environment:
      KIP_DATABASE_URL_FILE: /run/secrets/worker_database_url
      KIP_CONFIG: /app/config/kip.container.toml
      KIP_ENV: production
      KIP_CAS_PATH: /data/cas
    secrets:
      - worker_database_url
    command: ["worker", "run"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: volume
        source: kip_cas
        target: /data/cas
      - type: bind
        source: ${KIP_NAS_PATH:?set the approved collection root}
        target: /sources/nas
        read_only: true
        bind:
          create_host_path: false
      # Same ontology contract as the API, read-only: the worker validates
      # mining against the catalog but never writes releases.
      - type: bind
        source: ${KIP_ONTOLOGY_PATH:?set the version-controlled ontology checkout}
        target: /app/ontology
        read_only: true
        bind:
          create_host_path: false
    networks: [database, models]
    tmpfs:
      - /tmp:size=1g,mode=1777,noexec,nosuid,nodev
    healthcheck:
      # DB liveness from inside the worker container: the worker has no
      # listening port, so reachability of PostgreSQL with the worker's own
      # credentials is the meaningful liveness signal.
      test: ["CMD", "python", "-c", "import os, psycopg; psycopg.connect(open(os.environ['KIP_DATABASE_URL_FILE'], encoding='utf-8').read().strip(), connect_timeout=3).close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g
          pids: 256

networks:
  edge:
  database:
    internal: true
  models:
    internal: true
  model-egress:

volumes:
  kip_pgdata:
  kip_cas:
  kip_models:

secrets:
  postgres_password:
    file: ${KIP_POSTGRES_PASSWORD_FILE:?set the PostgreSQL password secret file}
  migrate_database_url:
    file: ${KIP_MIGRATE_DATABASE_URL_FILE:?set the migration database URL secret file}
  api_database_url:
    file: ${KIP_API_DATABASE_URL_FILE:?set the non-owner API database URL secret file}
  worker_database_url:
    file: ${KIP_WORKER_DATABASE_URL_FILE:?set the non-owner worker database URL secret file}
