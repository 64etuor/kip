[app]
environment = "development"
workspace = "default"
log_level = "INFO"

[database]
url_env = "KIP_DATABASE_URL"
statement_timeout_ms = 15000
pool_max_size = 10

[storage]
cas_path = "/data/cas"

[api]
host = "0.0.0.0"
port = 8080
require_api_key_outside_development = true
max_request_bytes = 10485760

[security]
allow_remote_model_egress = false
follow_symlinks = false
max_file_bytes = 524288000

[search]
semantic_enabled = false
context_max_chars = 120000
korean_ngram_min = 2
korean_ngram_max = 4
lexical_rerank_enabled = true
lexical_rerank_candidate_limit = 40

[models.reranker]
enabled = true
backend = "rapidfuzz"
max_document_chars = 8000
baseline_weight = 0.15

[graph]
backend = "postgres"

[ontology]
domain_profile = "research-project"
adaptive_discovery = true

[interaction]
enabled = true
clarification_ttl_seconds = 3600

[parsers]
parser_timeout_seconds = 120
minimum_quality_score = 0.70
shadow_parse_critical_documents = true

[parsers.ocr]
timeout_seconds = 120

[parsers.ocr.kordoc]
enabled = true
argv = ["kordoc", "--format", "json", "--ocr", "--silent"]
version_argv = ["kordoc", "--version"]
expected_version = "4.7.3"

[parsers.ocr.pptx]
max_images = 128
max_image_bytes = 20971520
max_total_bytes = 104857600
min_width_px = 96
min_height_px = 48

[parsers.hwp]
order = ["hwp-hwpx-parser", "kordoc", "unhwp", "paired_pdf"]

[parsers.hwp.hwp-hwpx-parser]
enabled = true
max_chars_per_unit = 4000

[parsers.hwp.kordoc]
enabled = false
argv = ["kordoc", "{input}", "--format", "json"]

[parsers.hwp.unhwp]
enabled = false
argv = ["unhwp", "convert", "{input}", "-o", "{output_dir}", "--all"]

[[sources.filesystem]]
name = "company-nas"
root = "/sources/nas"
enabled = true
read_only = true
settle_seconds = 2
include_extensions = [".md", ".txt", ".pdf", ".pptx", ".xlsx", ".hwp", ".hwpx", ".docx", ".csv"]
exclude_globs = ["**/.DS_Store", "**/~$*", "**/.~lock.*"]
acl_scope = "workspace:default"

[sources.slack]
enabled = false
workspace_id = ""
allowed_conversation_ids = []
download_files = false
token_env = "KIP_SLACK_BOT_TOKEN"

[sources.apple_mail]
enabled = false
allowed_accounts = []
allowed_mailboxes = ["INBOX", "Sent", "Archive"]
excluded_mailboxes = ["Junk", "Trash"]
lookback_days = 30

[sources.imap]
enabled = false
host = ""
port = 993
username_env = "KIP_IMAP_USERNAME"
password_env = "KIP_IMAP_PASSWORD"
mailboxes = ["INBOX", "Sent", "Archive"]
use_ssl = true
