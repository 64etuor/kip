# Intentionally no default Neo4j image tag. Set NEO4J_IMAGE explicitly after an adoption review.
services:
  neo4j:
    profiles: ["graph"]
    image: ${NEO4J_IMAGE:?set an approved and pinned Neo4j image}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${KIP_NEO4J_USERNAME}/${KIP_NEO4J_PASSWORD}
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - kip_neo4j_data:/data
    security_opt:
      - no-new-privileges:true
volumes:
  kip_neo4j_data:
