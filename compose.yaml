name: kip

services:
  postgres:
    image: ${KIP_POSTGRES_IMAGE:-pgvector/pgvector:0.8.2-pg18-trixie}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kip}
      POSTGRES_USER: ${POSTGRES_USER:-kip_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${KIP_POSTGRES_PORT:-5432}:5432"
    volumes:
      - kip_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kip_owner} -d ${POSTGRES_DB:-kip}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 1gb
    # The lexical index and vector projection outgrow the 128MB default on a
    # real corpus; size these to the host (see docs/OPERATIONS.md).
    command:
      - postgres
      - -c
      - shared_buffers=${KIP_POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${KIP_POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${KIP_POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${KIP_POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
    security_opt:
      - no-new-privileges:true

  # Embedding and reranker runtime for default semantic search (ADR-065).
  # Linux amd64 CPU image pinned by digest; the pinned model revisions are
  # downloaded once into kip_models. It has its own profile so a machine runs
  # exactly one model runtime: app-up.sh enables it on amd64 hosts (and
  # publishes it on loopback for host CLI/MCP) and uses the native host
  # runtime elsewhere. API and worker do not depend on it: search falls back
  # to lexical while it starts.
  models:
    profiles: ["semantic"]
    image: ${KIP_MODELS_IMAGE:-michaelf34/infinity:0.0.77-cpu@sha256:94db836145f609c508f3f296f3b9bd0e78ae088025e879664d073dfd9f929e96}
    restart: unless-stopped
    environment:
      HF_HOME: /models
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    # Embedding model only: the default hybrid mode does not call a
    # cross-encoder. For `models.reranker.backend = "http"`, append the
    # BAAI/bge-reranker-v2-m3 revision 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    # as a second --model-id/--revision/--served-model-name/--batch-size/--dtype.
    command: ["v2", "--host", "0.0.0.0", "--port", "7997",
              "--engine", "torch", "--device", "cpu", "--no-bettertransformer",
              "--model-id", "Qwen/Qwen3-Embedding-0.6B",
              "--revision", "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3",
              "--served-model-name", "kip-qwen3-embedding-0.6b",
              "--batch-size", "4", "--dtype", "float32"]
    ports:
      - "127.0.0.1:${KIP_SEMANTIC_PORT:-7997}:7997"
    volumes:
      - kip_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/models', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    restart: "no"
    env_file: .env
    environment:
      KIP_DATABASE_URL: postgresql://${POSTGRES_USER:-kip_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kip}
      KIP_CONFIG: /app/config/kip.container.toml
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    init: true
    cap_drop:
      - ALL
    pids_limit: 128
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true

  api:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      KIP_DATABASE_URL: postgresql://${POSTGRES_USER:-kip_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kip}
      KIP_CONFIG: /app/config/kip.container.toml
      KIP_API_HOST: 0.0.0.0
      KIP_CAS_PATH: /data/cas
    command: ["api", "serve", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${KIP_API_PORT:-8080}:8080"
    volumes:
      - kip_cas:/data/cas
      - ${KIP_NAS_PATH:-./sample-data}:/sources/nas:ro
      # Ontology auto-release (ADR-044) writes additive releases; the API is
      # the admin review surface, so it mounts the checkout read-write.
      - ${KIP_ONTOLOGY_PATH:-./ontology}:/app/ontology
    read_only: true
    init: true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true

  worker:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      KIP_DATABASE_URL: postgresql://${POSTGRES_USER:-kip_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kip}
      KIP_CONFIG: /app/config/kip.container.toml
      KIP_CAS_PATH: /data/cas
    command: ["worker", "run"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - kip_cas:/data/cas
      - ${KIP_NAS_PATH:-./sample-data}:/sources/nas:ro
      # Same ontology contract as the API, read-only: the worker never
      # writes releases.
      - ${KIP_ONTOLOGY_PATH:-./ontology}:/app/ontology:ro
    read_only: true
    init: true
    cap_drop:
      - ALL
    pids_limit: 256
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  kip_pgdata:
  kip_cas:
  kip_models:
