name: semantic-runtime

# The offline model-runtime check, kept off the push path on purpose.
#
# 3.12.1 was spent on a defect that only a real runtime can show: bootstrap
# prefetched the pinned embedding snapshot into one cache and
# scripts/semantic-server.sh looked in another, so a fresh install could not
# start the runtime without the network and search stayed lexical. Proving that
# absent means downloading about 1.2 GB of weights and holding several GB of
# RAM while the runtime loads, which is 20-30 minutes and far too expensive for
# every push. Pretending a scheduled download is covered by a push check would
# be worse than saying so, so it is separated here:
#
#   * this workflow runs weekly and on manual dispatch. Run it from the Actions
#     tab BEFORE tagging a release; docs/OPERATIONS.md lists it in the release
#     procedure.
#   * it does NOT gate publishing. ci.yml's `publish` job does not require it,
#     so a tag publishes whether this workflow is green, red or was never run
#     for that commit. Dispatching it before tagging is a manual step, and
#     nothing enforces it.
#   * the half that needs no download - a runtime that serves a DIFFERENT model
#     and answers HTTP 200 anyway, the 3.12.2 defect - runs on every push as the
#     `semantic served-model guard` job in ci.yml.
#
# Measured runtime: 20-30 minutes on ubuntu-latest, most of it the runtime
# install and the one-time weight download.

on:
  schedule:
    # Mondays 03:17 UTC. Off the hour: scheduled workflows queue at :00.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-runtime-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.12"
  UV_NO_PROGRESS: "1"

jobs:
  offline-runtime:
    name: model runtime starts offline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Installs the candidate package into a throwaway deployment with
      # semantic search ON, so bootstrap installs the runtime and prefetches
      # the pinned snapshot, then starts the runtime with the Hugging Face hub
      # forced offline and embeds through it. The model cache, the PID file and
      # the port all belong to that throwaway deployment.
      - name: A fresh install starts its model runtime with no network
        run: ./scripts/e2e-semantic.sh --mode offline-runtime

      - name: Report
        if: always()
        run: |
          printf 'Run this workflow before tagging a release; see docs/OPERATIONS.md.\n'
