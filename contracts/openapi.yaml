    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
  /readyz:
    get:
      summary: Readyz
      description: 'Readiness: liveness plus a real round-trip to the canonical store.


        Container orchestration and ops probes use this endpoint; /healthz

        stays process-liveness only. Any repository failure fails closed with

        503 and no internal detail.'
      operationId: readyz_readyz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
