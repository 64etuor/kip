schema_version: kip.golden-dataset.v1
name: private-onedrive-nl
description: >
  19 corpus-grounded Korean retrieval cases over the private OneDrive
  workspace (QMS procedures, battery QC, government program notices).
  Every question was derived from a verbatim quote read from the expected
  document's evidence unit. Lifecycle is draft on purpose: cases were
  machine-grounded, then adversarially re-verified case by case by an
  independent agent (18/19 pass; EI-001 widened to both legitimate
  targets). Promotion authority for this review was explicitly delegated
  by the workspace owner in the 2026-08-11 session. corpus_fingerprint is
  sha256 over the sorted current revision hashes of the default
  workspace at review time.
lifecycle: reviewed
