[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kip-knowledge-fabric"
version = "3.1.0"
description = "Agent-first evidence-backed knowledge fabric for files, Slack, and mail"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "KIP Project"}]
dependencies = [
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
extractors = ["openpyxl>=3.1,<4", "PyMuPDF>=1.25,<2", "hwp-hwpx-parser>=1,<2"]
semantic = ["torch>=2.5,<3", "transformers>=4.57,<5", "einops>=0.8,<1"]
mcp = ["mcp>=1.0,<2"]
neo4j = ["neo4j>=5.26,<7"]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "jsonschema>=4.23,<5",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0,<7",
]
all = [
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "openpyxl>=3.1,<4",
  "PyMuPDF>=1.25,<2",
  "hwp-hwpx-parser>=1,<2",
  "torch>=2.5,<3",
  "transformers>=4.57,<5",
  "einops>=0.8,<1",
  "mcp>=1.0,<2",
  "neo4j>=5.26,<7",
]

[project.scripts]
kip = "kip.cli:main"
kip-api = "kip.api:main"
kip-worker = "kip.worker:main"
kip-mcp = "kip.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["tests/fixtures"]
