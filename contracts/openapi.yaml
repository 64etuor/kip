components:
  schemas:
    AclSnapshot:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        version:
          type: string
          minLength: 1
          title: Version
        provider:
          type: string
          minLength: 1
          title: Provider
        scopes:
          items:
            type: string
          type: array
          title: Scopes
        captured_at:
          type: string
          format: date-time
          title: Captured At
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        configuration_owned:
          type: boolean
          title: Configuration Owned
          default: false
      additionalProperties: false
      type: object
      required:
      - id
      - version
      - provider
      - captured_at
      title: AclSnapshot
    AnswerRequest:
      properties:
        query:
          type: string
          minLength: 1
          title: Query
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 10
        source_kinds:
          items:
            type: string
          type: array
          title: Source Kinds
        document_types:
          items:
            type: string
          type: array
          title: Document Types
        project_ids:
          items:
            type: string
          type: array
          title: Project Ids
        include_candidate_assertions:
          type: boolean
          title: Include Candidate Assertions
          default: false
        max_chars:
          type: integer
          maximum: 40000.0
          minimum: 1000.0
          title: Max Chars
          default: 12000
      additionalProperties: false
      type: object
      required:
      - query
      title: AnswerRequest
    ConnectorEvent:
      properties:
        schema_version:
          type: string
          const: kip.connector-event.v1
          title: Schema Version
          default: kip.connector-event.v1
        event_id:
          type: string
          title: Event Id
        connector_name:
          type: string
          title: Connector Name
        operation:
          type: string
          enum:
          - upsert
          - delete
          - sync_complete
          title: Operation
        external_id:
          type: string
          title: External Id
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        payload:
          additionalProperties: true
          type: object
          title: Payload
        acl_scopes:
          items:
            type: string
          type: array
          title: Acl Scopes
        acl_snapshot:
          anyOf:
          - $ref: '#/components/schemas/AclSnapshot'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - event_id
      - connector_name
      - operation
      - external_id
      title: ConnectorEvent
    ContextRequest:
      properties:
        query:
          type: string
          minLength: 1
          title: Query
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 10
        source_kinds:
          items:
            type: string
          type: array
          title: Source Kinds
        document_types:
          items:
            type: string
          type: array
          title: Document Types
        project_ids:
          items:
            type: string
          type: array
          title: Project Ids
        include_candidate_assertions:
          type: boolean
          title: Include Candidate Assertions
          default: false
        max_chars:
          type: integer
          maximum: 200000.0
          minimum: 1000.0
          title: Max Chars
          default: 40000
      additionalProperties: false
      type: object
      required:
      - query
      title: ContextRequest
    Envelope:
      properties:
        schema_version:
          type: string
          const: kip.envelope.v1
          title: Schema Version
          default: kip.envelope.v1
        ok:
          type: boolean
          title: Ok
        data:
          title: Data
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorInfo'
          - type: 'null'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'
      additionalProperties: false
      type: object
      required:
      - ok
      - meta
      title: Envelope
    EnvelopeMeta:
      properties:
        request_id:
          type: string
          title: Request Id
        workspace:
          type: string
          title: Workspace
        generated_at:
          type: string
          format: date-time
          title: Generated At
        warnings:
          items:
            type: string
          type: array
          title: Warnings
      additionalProperties: false
      type: object
      required:
      - request_id
      - workspace
      title: EnvelopeMeta
    ErrorInfo:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          additionalProperties: true
          type: object
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ErrorInfo
    GraphNeighborsRequest:
      properties:
        node_id:
          type: string
          title: Node Id
        predicates:
          items:
            type: string
          type: array
          title: Predicates
        direction:
          type: string
          enum:
          - out
          - in
          - both
          title: Direction
          default: both
        limit:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Limit
          default: 100
        approved_only:
          type: boolean
          title: Approved Only
          default: true
      additionalProperties: false
      type: object
      required:
      - node_id
      title: GraphNeighborsRequest
    GraphPathRequest:
      properties:
        from_node_id:
          type: string
          title: From Node Id
        to_node_id:
          type: string
          title: To Node Id
        predicates:
          items:
            type: string
          type: array
          title: Predicates
        max_depth:
          type: integer
          maximum: 8.0
          minimum: 1.0
          title: Max Depth
          default: 4
        approved_only:
          type: boolean
          title: Approved Only
          default: true
      additionalProperties: false
      type: object
      required:
      - from_node_id
      - to_node_id
      title: GraphPathRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KnowledgeEntity:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        entity_type:
          type: string
          minLength: 1
          title: Entity Type
        canonical_name:
          type: string
          minLength: 1
          title: Canonical Name
        canonical_name_normalized:
          type: string
          title: Canonical Name Normalized
          default: ''
        aliases:
          items:
            type: string
          type: array
          title: Aliases
        status:
          type: string
          enum:
          - active
          - merged
          - retired
          title: Status
          default: active
        acl_scopes:
          items:
            type: string
          type: array
          title: Acl Scopes
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
      additionalProperties: false
      type: object
      required:
      - id
      - entity_type
      - canonical_name
      title: KnowledgeEntity
    OntologyMiningSubmission:
      properties:
        unit_ids:
          items:
            type: string
          type: array
          maxItems: 500
          minItems: 1
          title: Unit Ids
      additionalProperties: false
      type: object
      required:
      - unit_ids
      title: OntologyMiningSubmission
    SearchRequest:
      properties:
        query:
          type: string
          minLength: 1
          title: Query
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 10
        source_kinds:
          items:
            type: string
          type: array
          title: Source Kinds
        document_types:
          items:
            type: string
          type: array
          title: Document Types
        project_ids:
          items:
            type: string
          type: array
          title: Project Ids
        include_candidate_assertions:
          type: boolean
          title: Include Candidate Assertions
          default: false
      additionalProperties: false
      type: object
      required:
      - query
      title: SearchRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
